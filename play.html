<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<script>
(function () {
  function stopZoom(ev) { ev.preventDefault(); }
  document.addEventListener("gesturestart", stopZoom, { passive: false });
  document.addEventListener("gesturechange", stopZoom, { passive: false });
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="GamePal"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#f2f2f7"/>
<link rel="apple-touch-icon" href="./icons/mark-180.png?v=1"/>
<title>GamePal</title>
<script src="./config.js?v=1788312093"></script>
<script src="./gate.js?v=2"></script>
<link rel="stylesheet" href="./app.css?v=4"/>
<link rel="stylesheet" href="./play.css?v=3"/>
<link rel="stylesheet" href="./chat.css?v=9"/>
</head>
<body class="famiWeb lightTheme">
<div id="topMenu" class="navMenu">
  <div class="navContainer">
    <button type="button" id="backShelf" class="ins-icon nav-back" aria-label="返回">
      <span class="ins-ring"></span>
      <span class="ins-face">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5M8.5 12H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
    <div id="bookInfo">
      <h2 id="bookTitle">艾爾登法環</h2>
    </div>
    <div id="reader-settings" class="album-settings">
      <button type="button" id="configButton" class="ins-icon settings-toggle" aria-label="設定" aria-expanded="false">
        <span class="ins-ring"></span>
        <span class="ins-face">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 3.8l.6-1.3h3.6l.6 1.3 1.6.7 1.4-.5 2.5 2.5-.5 1.4.7 1.6 1.3.6v3.6l-1.3.6-.7 1.6.5 1.4-2.5 2.5-1.4-.5-1.6.7-.6 1.3h-3.6l-.6-1.3-1.6-.7-1.4.5-2.5-2.5.5-1.4-.7-1.6-1.3-.6v-3.6l1.3-.6.7-1.6-.5-1.4L6.6 4l1.4.5 1.6-.7z" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/><circle cx="12" cy="11.9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </span>
      </button>
      <div id="readerSettingsMenu" class="settings-menu" hidden role="menu">
        <button type="button" class="settings-entry" id="openQueue" role="menuitem">
          <span class="ins-icon job-icon" aria-hidden="true"><span class="ins-ring"></span><span class="ins-face"><svg viewBox="0 0 24 24"><path d="M6 7h12M6 12h12M6 17h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span></span>
          <span>工作佇列</span>
        </button>
        <button type="button" class="settings-entry" id="backToShelf" role="menuitem">
          <span class="ins-icon job-icon" aria-hidden="true"><span class="ins-ring"></span><span class="ins-face"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5M8.5 12H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
          <span>返回</span>
        </button>
      </div>
    </div>
  </div>
</div>
<div class="play-stage">
  <div class="play-log" id="playLog"></div>
  <div class="invite-wait is-chat-wait" id="playWait" hidden aria-live="polite">
    <p class="play-job" id="playJob"></p>
    <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="invite-wait-bar" id="playWaitBar"></div>
  </div>
  <form class="apple-row play-input" id="playForm">
    <input id="playInput" maxlength="500" autocomplete="off" enterkeyhint="send" placeholder="現在打到哪，或想拿什麼"/>
    <button type="submit" class="apple-next" aria-label="繼續">
      <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
    </button>
  </form>
</div>
<div class="batch-tag-mask" id="actMask" hidden>
  <div class="batch-tag-sheet" id="actSheet">
    <div class="batch-tag-head">
      <p id="actTitle">工作佇列</p>
      <button type="button" class="batch-tag-close" id="actClose" aria-label="關閉">×</button>
    </div>
    <div id="actBody"></div>
  </div>
</div>
<div class="settings-catch" id="readerSettingsCatch" hidden></div>
<script src="./mark.js?v=1"></script>
<script src="./play.js?v=15"></script>
</body>
</html>
