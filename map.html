<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<script>
(function () {
  function stopZoom(ev) { ev.preventDefault(); }
  document.addEventListener("gesturestart", stopZoom, { passive: false });
  document.addEventListener("gesturechange", stopZoom, { passive: false });
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="GamePal"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#f2f2f7"/>
<link rel="apple-touch-icon" href="./icons/mark-180.png?v=1"/>
<title>地圖</title>
<script src="./config.js?v=1788497704"></script>
<script>
(function () {
  var origin = window.VAULT_ORIGIN;
  if (!origin) return;
  var link = document.createElement("link");
  link.rel = "preconnect";
  link.href = origin;
  link.crossOrigin = "anonymous";
  document.head.appendChild(link);
})();
</script>
<script src="./gate.js?v=2"></script>
<link rel="stylesheet" href="./app.css?v=6"/>
<link rel="stylesheet" href="./play.css?v=3"/>
<link rel="stylesheet" href="./map.css?v=10"/>
</head>
<body class="famiWeb lightTheme">
<div id="loaderContainer">
  <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <p class="read-wait">打開地圖</p>
</div>
<div id="topMenu" class="navMenu">
  <div class="navContainer">
    <button type="button" id="backShelf" class="ins-icon nav-back" aria-label="返回">
      <span class="ins-ring"></span>
      <span class="ins-face">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5M8.5 12H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
    <div id="bookInfo">
      <h2 id="bookTitle">地圖</h2>
    </div>
    <div id="reader-settings" class="album-settings">
      <button type="button" id="configButton" class="ins-icon settings-toggle" aria-label="設定" aria-expanded="false">
        <span class="ins-ring"></span>
        <span class="ins-face">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 3.8l.6-1.3h3.6l.6 1.3 1.6.7 1.4-.5 2.5 2.5-.5 1.4.7 1.6 1.3.6v3.6l-1.3.6-.7 1.6.5 1.4-2.5 2.5-1.4-.5-1.6.7-.6 1.3h-3.6l-.6-1.3-1.6-.7-1.4.5-2.5-2.5.5-1.4-.7-1.6-1.3-.6v-3.6l1.3-.6.7-1.6-.5-1.4L6.6 4l1.4.5 1.6-.7z" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/><circle cx="12" cy="11.9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </span>
      </button>
      <div id="readerSettingsMenu" class="settings-menu" hidden role="menu"></div>
    </div>
  </div>
</div>
<div class="map-stage">
  <div class="map-chips" id="mapChips" role="tablist"></div>
  <div class="apple-row">
    <input id="mapFind" type="search" placeholder="查地名或道具" enterkeyhint="search"/>
  </div>
  <div id="mapHits" class="tag-row map-hits" hidden></div>
  <div class="map-body">
    <canvas id="mapCanvas"></canvas>
    <div class="batch-tag-mask list-tag-mask" id="filterMask" hidden>
      <div class="list-tag-sheet" id="filterSheet">
        <div class="batch-tag-head">
          <p id="filterTitle">顯示</p>
          <button type="button" class="batch-tag-close" id="filterClose" aria-label="關閉">×</button>
        </div>
        <div class="list-tag-body" id="filterBody"></div>
      </div>
    </div>
  </div>
  <p class="map-hint" id="mapHint"></p>
</div>
<div class="settings-catch" id="readerSettingsCatch" hidden></div>
<div class="settings-menu" id="markMenu" hidden role="menu"></div>
<div class="batch-tag-mask" id="actMask" hidden>
  <div class="batch-tag-sheet" id="actSheet">
    <div class="batch-tag-head">
      <p id="actTitle">標記</p>
      <button type="button" class="batch-tag-close" id="actClose" aria-label="關閉">×</button>
    </div>
    <div id="actBody"></div>
  </div>
</div>
<div class="ask-mask" id="askMask" hidden>
  <div class="ask-card" role="dialog" aria-modal="true">
    <p id="askText">丟掉這個標記?</p>
    <div class="ask-actions">
      <button type="button" class="ask-no" id="askNo">取消</button>
      <button type="button" class="ask-yes" id="askYes">丟掉</button>
    </div>
  </div>
</div>
<script src="./mark.js?v=1"></script>
<script src="./map.js?v=20"></script>
</body>
</html>
