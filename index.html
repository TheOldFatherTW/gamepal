<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<script>
(function () {
  function stopZoom(ev) { ev.preventDefault(); }
  document.addEventListener("gesturestart", stopZoom, { passive: false });
  document.addEventListener("gesturechange", stopZoom, { passive: false });
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="GamePal"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#fafafa"/>
<link rel="apple-touch-icon" href="./icons/mark-180.png?v=1"/>
<link rel="icon" type="image/png" href="./icons/mark-180.png?v=1"/>
<title>GamePal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./app.css?v=3"/>
<link rel="stylesheet" href="./chat.css?v=2"/>
<script src="./config.js?v=1756557500"></script>
<script>
(function () {
  var KEY_RE = /^[A-Za-z0-9_-]{8,128}$/;
  var stored = "";
  try { stored = localStorage.getItem("gamepal.viewKey") || ""; } catch (e) {}
  var cookie = "";
  try {
    var m = document.cookie.match(/(?:^|; )gamepal\.viewKey=([^;]*)/);
    cookie = m ? decodeURIComponent(m[1]) : "";
  } catch (e) {}
  var q = new URLSearchParams(location.search).get("k") || "";
  var h = "";
  try {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw.indexOf("k=") === 0) {
      h = decodeURIComponent((raw.slice(2).split("&")[0] || "").replace(/\+/g, " "));
    } else {
      h = new URLSearchParams(raw).get("k") || "";
    }
  } catch (e) {}
  var fromUrl = KEY_RE.test(q) ? q : KEY_RE.test(h) ? h : "";
  var token = fromUrl || (KEY_RE.test(stored) ? stored : "") || (KEY_RE.test(cookie) ? cookie : "");
  window.GAMEPAL_URL_KEY = fromUrl;
  window.GAMEPAL_VIEW_KEY = token;
  if (token) {
    try { localStorage.setItem("gamepal.viewKey", token); } catch (e) {}
    if (typeof navigator.standalone === "boolean" && !navigator.standalone) {
      var pin = location.pathname + "?k=" + encodeURIComponent(token) + "#k=" + encodeURIComponent(token);
      if (location.pathname + location.search + location.hash !== pin) {
        history.replaceState({}, "", pin);
      }
    }
  }
  var origin = window.VAULT_ORIGIN;
  if (origin) {
    var link = document.createElement("link");
    link.rel = "preconnect";
    link.href = origin;
    link.crossOrigin = "anonymous";
    document.head.appendChild(link);
  }
})();
</script>
</head>
<body>
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="hall with-feed is-booting" id="hall">
  <div class="profile">
    <div class="pal-mark" id="pal-mark"></div>
    <h1 class="brand">GamePal</h1>
    <p class="status" id="status">正在連接遊戲櫃…</p>
  </div>
  <div class="invite-panel" id="invite-panel" hidden>
    <p class="invite-hey">今天打哪一款?</p>
    <p class="invite-safari" id="invite-safari" hidden>請用 Safari 打開</p>
    <button type="button" class="invite-go" id="invite-go">開始</button>
    <form id="invite-name-form" hidden>
      <p class="err" id="invite-name-err"></p>
      <label for="invite-name">你叫什麼</label>
      <div class="apple-row">
        <input id="invite-name" autocomplete="nickname" maxlength="24" required/>
        <button type="submit" class="apple-next" aria-label="繼續">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
        </button>
      </div>
    </form>
    <div class="invite-wait" id="invite-wait" hidden>
      <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="invite-wait-bar" id="invite-wait-bar"></div>
    </div>
  </div>
  <div class="stage-bg" id="stage-bg" hidden></div>
  <div class="home-head" id="home-head" hidden>
    <div class="cab-hud" id="cab-hud" hidden>
      <div class="cab-wrap">
        <div class="cab-cover">
          <div class="cab-ring" aria-hidden="true"></div>
          <div class="cab-face"><img id="face-img" alt="" src="./face-default.jpg?v=1"/><span class="cab-foil" aria-hidden="true"></span></div>
          <div class="cab-mask" aria-hidden="true"></div>
        </div>
        <div id="album-settings" class="album-settings" hidden></div>
      </div>
      <p class="reader-name" id="reader-name"></p>
    </div>
    <div class="tag-board" id="tag-board" hidden>
      <div class="mode-bar" id="mode-bar" hidden></div>
    </div>
  </div>
  <div class="feed" id="feed"></div>
  <div class="home-chat" id="homeChat" hidden>
    <div class="play-log" id="playLog"></div>
    <div class="invite-wait" id="playWait" hidden>
      <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="invite-wait-bar" id="playWaitBar"></div>
    </div>
    <form class="apple-row play-input" id="playForm">
      <input id="playInput" maxlength="500" autocomplete="off" enterkeyhint="send" placeholder="跟我說你卡在哪"/>
      <button type="submit" class="apple-next" aria-label="繼續">
        <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
      </button>
    </form>
  </div>
</div>
<aside class="photo-rail" id="photo-rail" hidden aria-label="遊戲操作"></aside>
<input id="cover-input" type="file" accept="image/*" hidden/>
<input id="backdrop-input" type="file" accept="image/*" hidden/>
<div class="batch-tag-mask" id="actMask" hidden>
  <div class="batch-tag-sheet" id="actSheet">
    <div class="batch-tag-head">
      <p id="actTitle">工作佇列</p>
      <button type="button" class="batch-tag-close" id="actClose" aria-label="關閉">×</button>
    </div>
    <div id="actBody"></div>
  </div>
</div>
<div class="batch-tag-mask" id="waitMask" hidden>
  <div class="batch-tag-sheet is-wait" id="waitSheet">
    <div class="batch-tag-head">
      <p id="waitTitle">更換背景中</p>
    </div>
    <p class="wait-pct" id="waitPct">0%</p>
    <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</div>
<div class="ask-mask" id="askMask" hidden>
  <div class="ask-card" role="dialog" aria-modal="true">
    <p id="askText">是否取消最愛</p>
    <div class="ask-actions">
      <button type="button" class="ask-no" id="askNo">取消</button>
      <button type="button" class="ask-yes" id="askYes" hidden>丟掉</button>
      <button type="button" class="tag-apply" id="askOk"><span class="tag-apply-face">確認</span></button>
    </div>
  </div>
</div>
<div class="home-install" id="home-install" hidden>
  <p>請點底部分享，再選加入主畫面</p>
  <button type="button" class="invite-go" id="home-installed">我已加入</button>
</div>
<div id="reader-layer" hidden>
  <div id="reader-bridge">
    <img id="reader-bridge-cover" alt="" hidden/>
    <div id="reader-hint" hidden>
      <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <p class="read-wait">打開陪玩</p>
    </div>
  </div>
  <button type="button" class="ins-icon nav-back" id="reader-back" aria-label="返回">
    <span class="ins-ring"></span>
    <span class="ins-face">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5M8.5 12H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </button>
  <iframe id="reader-frame" title="陪玩" src="about:blank"></iframe>
</div>
<script src="./mark.js?v=1"></script>
<script src="./gate.js?v=1"></script>
<script src="./door.js?v=3"></script>
</body>
</html>
